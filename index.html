<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom — 4 Pillars + Buddy (v2)</title>
<style>
  :root {
    color-scheme: dark;
    --page:           #0b0d10;
    --surface-1:      #15181d;
    --surface-2:      #1f232a;
    --text-primary:   #f5f6f8;
    --text-secondary: #a3a8b4;
    --muted:          #6c7280;
    --gridline:       #262a32;
    --baseline:       #363b46;
    --border:         rgba(255,255,255,0.08);
    --series-1:       #6fa8ff;
    --accent:         #5eead4;
    --accent-soft:    rgba(94,234,212,0.14);
    --accent-rgb:     94,234,212;
    --good:           #4ade80;
    --warning:        #fbbf24;
    --critical:       #f87171;
    --on-accent:      #041a16;
    --cta-bg:         var(--accent);
    --cta-text:       var(--on-accent);
    --card-shadow:    0 10px 24px rgba(0,0,0,0.35);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --page:           #f6f6f9;
    --surface-1:      #ffffff;
    --surface-2:      #f0f1f5;
    --text-primary:   #131418;
    --text-secondary: #62636e;
    --muted:          #9497a3;
    --gridline:       #e9e9ef;
    --baseline:       #dcdde3;
    --border:         rgba(20,20,35,0.08);
    --series-1:       #6366f1;
    --accent:         #6d5cf5;
    --accent-soft:    rgba(109,92,245,0.12);
    --accent-rgb:     109,92,245;
    --good:           #16a34a;
    --warning:        #d97706;
    --critical:       #dc2626;
    --on-accent:      #ffffff;
    --cta-bg:         #14151a;
    --cta-text:       #ffffff;
    --card-shadow:    0 4px 16px rgba(20,20,35,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "SF Pro Display", system-ui, "Segoe UI", sans-serif;
    background: radial-gradient(circle at 25% 12%, #1c2028 0%, #0a0b0e 55%, #050608 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 12px;
    font-feature-settings: "tnum" 1;
  }
  .phone {
    width: 380px; max-width: 100%; height: 800px; max-height: 92vh;
    background: var(--page); border-radius: 44px;
    box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 0 0 9px #15181d, 0 0 0 10px rgba(255,255,255,0.05);
    overflow: hidden; display: flex; flex-direction: column; position: relative;
  }
  .app-header { padding: 18px 20px 8px; display:flex; align-items:center; justify-content:center; gap:7px; }
  .app-header .brand-mark { display:flex; color: var(--accent); }
  .app-header .brand-word { font-size: 17px; font-weight: 800; letter-spacing: 0.01em; color: var(--text-primary); }

  main { flex: 1; overflow-y: auto; padding: 4px 20px 18px; }
  main::-webkit-scrollbar { width: 0; }
  /* Guard against id-specific display rules (e.g. #view-talk's display:flex) beating the
     browser's own [hidden]{display:none} rule on specificity — without this, a hidden view
     can still occupy flex space in .phone's column layout and squeeze the active view. */
  main[hidden] { display: none !important; }

  .hero { display:flex; flex-direction:column; align-items:center; padding: 8px 0 2px; }
  .ring-label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .ring-zone { font-size: 12px; font-weight: 700; margin-top: 8px; display:flex; align-items:center; gap:6px; }
  .ring-zone .dot { width:8px; height:8px; border-radius:50%; }

  .pillar-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .pillar-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 14px; display:flex; flex-direction:column; align-items:center; cursor:pointer; box-shadow: var(--card-shadow); transition: border-color .15s, transform .1s; }
  .pillar-card:active { transform: scale(0.98); }
  .pillar-card .pname { font-size: 11px; font-weight: 700; text-transform:uppercase; letter-spacing:0.04em; color: var(--text-secondary); margin-top: 8px; }

  .checkin-cta { width: 100%; border: none; border-radius: 18px; padding: 15px; font-size: 14.5px; font-weight: 700; color: var(--cta-text); background: var(--cta-bg); cursor: pointer; margin: 4px 0 14px; box-shadow: 0 10px 24px rgba(var(--accent-rgb),0.25); display:flex; align-items:center; justify-content:center; gap:8px; }
  .checkin-cta.done { background: var(--surface-2); color: var(--good); border: 1.5px solid var(--good); box-shadow: none; }

  /* Pet card (consolidates streak + points + pet) */
  .pet-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; display:flex; align-items:center; gap: 12px; cursor:pointer; box-shadow: var(--card-shadow); }
  .pet-avatar { width: 52px; height: 52px; border-radius: 50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; position:relative; filter: drop-shadow(0 3px 5px rgba(0,0,0,0.45)); }
  .pet-avatar .accessory { position:absolute; top:-15px; left:50%; transform:translateX(-50%); display:block; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5)); }
  .pet-info { flex: 1; min-width: 0; }
  .pet-info .toprow { display:flex; align-items:center; justify-content:space-between; }
  .pet-info .pname2 { font-size: 13.5px; font-weight: 800; color: var(--text-primary); }
  .pet-info .lvl { font-size: 10px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 2px 7px; border-radius: 999px; }
  .xp-track { width:100%; height: 6px; background: var(--surface-2); border-radius: 999px; margin-top: 6px; overflow:hidden; }
  .xp-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .pet-stats { display:flex; gap: 10px; margin-top: 5px; font-size: 11px; color: var(--muted); font-weight:600; }

  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px; margin-bottom: 14px; box-shadow: var(--card-shadow); }
  .card h3 { margin: 0 0 8px; font-size: 12px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color: var(--muted); }
  .card p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.45; }

  .tabbar { display:flex; border-top: 1px solid var(--border); background: var(--surface-1); }
  .tabbar button { flex:1; border:none; background:none; padding: 9px 2px 12px; font-size: 9.5px; font-weight:700; color: var(--muted); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; letter-spacing:0.01em; text-transform:uppercase; }
  .tabbar button .ic { display:flex; align-items:center; justify-content:center; }
  .tabbar button.active { color: var(--accent); }

  h2.page-title { font-size: 11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; color: var(--muted); margin: 6px 0 14px; }

  .back-row { display:flex; align-items:center; gap: 10px; margin: 2px 0 10px; cursor:pointer; }
  .back-row .arrow { display:flex; color: var(--text-primary); }
  .back-row .btitle { font-size: 13px; font-weight: 700; color: var(--text-primary); text-transform:uppercase; letter-spacing:0.04em; }

  /* AI Insights — tinted (not white, unlike the plain cards around it) and given a quiet
     chevron affordance so it visually registers as the one worth tapping, without adding
     any icon/emoji clutter. Only #aiCard gets the tint — #loadCard shares the same base
     layout class but stays plain white, so the tint reads as "this one's different" rather
     than being just another color everything has. */
  .ai-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; display:flex; align-items:center; gap: 12px; cursor:pointer; position:relative; box-shadow: var(--card-shadow); }
  #aiCard { background: var(--accent-soft); border-color: rgba(var(--accent-rgb),0.35); box-shadow: 0 10px 26px rgba(var(--accent-rgb),0.14); }
  .ai-card .ai-ic { width:40px; height:40px; border-radius:50%; background:var(--surface-2); color: var(--text-secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #aiCard .ai-ic { background: rgba(var(--accent-rgb),0.16); color: var(--accent); }
  .ai-card .ai-body { flex:1; min-width:0; }
  .ai-card .ai-title { font-size: 12.5px; font-weight:800; color: var(--text-primary); }
  .ai-card .ai-sub { font-size: 11px; color: var(--muted); margin-top:2px; }
  #aiCard .ai-sub { color: var(--text-secondary); }
  .ai-card .ai-dot { position:absolute; top:12px; right:14px; width:8px; height:8px; border-radius:50%; background: var(--warning); }
  .ai-card .ai-chevron { flex-shrink:0; color: var(--accent); opacity: 0.7; }
  .ai-banner { background: var(--surface-2); border: 1px dashed var(--border); border-radius: 14px; padding: 12px 14px; font-size: 11.5px; color: var(--muted); line-height:1.5; margin-bottom: 14px; }
  .alert-card { display:flex; gap: 12px; padding: 14px 16px; background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--card-shadow); }
  .alert-card .a-ic { font-size: 18px; flex-shrink:0; margin-top:1px; }
  .alert-card .a-text { font-size: 13px; color: var(--text-primary); line-height:1.45; }
  .alert-card .a-time { font-size: 10px; color: var(--muted); font-weight:700; text-transform:uppercase; margin-top:5px; }
  .narrative-text { font-size: 13.5px; color: var(--text-secondary); line-height: 1.65; }
  .narrative-text strong { color: var(--text-primary); }

  /* Talk to Bloom — open-ended chat, laid out as its own flex column so the message list
     scrolls independently while the composer stays pinned at the bottom, unlike the plain
     scrolling <main> every other view uses. */
  #view-talk { display:flex; flex-direction:column; overflow:hidden; padding-bottom:0; }
  .talk-messages { flex:1; overflow-y:auto; padding-bottom: 10px; }
  .talk-messages::-webkit-scrollbar { width:0; }
  .talk-row { display:flex; margin-bottom: 10px; }
  .talk-row.user { justify-content:flex-end; }
  .talk-row.bloom { justify-content:flex-start; }
  .talk-bubble { max-width: 82%; padding: 11px 14px; border-radius: 16px; font-size: 13.5px; line-height:1.5; }
  .talk-row.user .talk-bubble { background: var(--cta-bg); color: var(--cta-text); border-bottom-right-radius: 5px; }
  .talk-row.bloom .talk-bubble { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-bottom-left-radius: 5px; box-shadow: var(--card-shadow); }
  .talk-resource-card { display:flex; gap:10px; background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.35); border-radius: 16px; padding: 13px 15px; margin: 4px 0 14px; }
  .talk-resource-card .tric { color: var(--critical); flex-shrink:0; margin-top:1px; }
  .talk-resource-card .trtext { font-size: 12.5px; color: var(--text-primary); line-height:1.5; }
  .talk-resource-card .trtext strong { display:block; margin-bottom:2px; color: var(--critical); }
  .talk-starter-row { display:flex; flex-wrap:wrap; gap:8px; margin: 6px 0 4px; }
  .talk-input-row { flex-shrink:0; display:flex; align-items:flex-end; gap:8px; padding: 10px 20px 18px; border-top: 1px solid var(--border); background: var(--page); }
  .talk-input-row textarea { flex:1; min-height:40px; max-height:90px; border-radius:18px; border:1px solid var(--border); background: var(--surface-2); color: var(--text-primary); padding: 10px 14px; font-size: 13.5px; font-family: inherit; resize:none; }
  .talk-send-btn { flex-shrink:0; width:40px; height:40px; border-radius:50%; border:none; background: var(--accent); color: var(--on-accent); display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .talk-send-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .talk-typing { display:flex; gap:4px; padding: 4px 2px; }
  .talk-typing span { width:6px; height:6px; border-radius:50%; background: var(--muted); animation: thinkPulse 1s ease-in-out infinite; }
  .talk-typing span:nth-child(2) { animation-delay: .15s; }
  .talk-typing span:nth-child(3) { animation-delay: .3s; }

  .stat-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; box-shadow: var(--card-shadow); }
  .stat-tile .val { font-size: 22px; font-weight: 800; color: var(--text-primary); }
  .stat-tile .lbl { font-size: 10px; color: var(--muted); margin-top: 2px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }

  .week-strip { display:flex; gap: 6px; margin-bottom: 4px; }
  .week-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .week-day .bar { width: 100%; height: 34px; border-radius: 8px; display:flex; align-items:flex-end; padding:2px; }
  .week-day .lbl { font-size: 9.5px; color: var(--muted); font-weight:700; text-transform:uppercase; }

  .chart-wrap { position: relative; }
  .chart-toolbar { display:flex; justify-content: space-between; align-items:center; margin-bottom: 8px; }
  .chart-toolbar .title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .chart-toolbar button { font-size: 10.5px; font-weight: 700; color: var(--accent); background: none; border: 1px solid var(--accent); border-radius: 999px; padding: 4px 10px; cursor: pointer; }
  svg.linechart { width: 100%; height: 140px; overflow: visible; }
  .tooltip { position: absolute; background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border); font-size: 11px; padding: 6px 9px; border-radius: 8px; pointer-events: none; white-space: nowrap; transform: translate(-50%, -115%); opacity: 0; transition: opacity .1s; z-index: 5; font-weight:600; box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.data-table th, table.data-table td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--gridline); color: var(--text-secondary); }
  table.data-table th { color: var(--muted); font-weight: 700; text-transform:uppercase; font-size:10px; }
  .insight { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }

  .row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--gridline); }
  .row:last-child { border-bottom: none; }
  .row .lbl { font-size: 13px; font-weight: 700; color: var(--text-primary); }
  .row .desc { font-size: 11px; color: var(--muted); margin-top: 2px; max-width: 220px; }
  .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
  .switch input { opacity:0; width:0; height:0; }
  .toggle-slider { position:absolute; inset:0; background: var(--gridline); border-radius: 999px; cursor:pointer; transition: .2s; }
  .toggle-slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .toggle-slider { background: var(--accent); }
  input:checked + .toggle-slider:before { transform: translateX(18px); }
  .seg-control { display:flex; gap:4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 13px; padding: 4px; margin-top: 8px; }
  .seg-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:6px; border:none; background:none; padding: 9px 4px; border-radius: 10px; font-size: 12px; font-weight:700; color: var(--text-secondary); cursor:pointer; }
  .seg-btn.selected { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
  .seg-btn.selected svg { color: var(--accent); }
  input[type="time"] { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); }
  input[type="text"] { width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); font-size: 14px; margin-top: 6px; }

  .reminder-item { display:flex; align-items:center; justify-content:space-between; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--text-primary); }
  .reminder-item button { background:none; border:none; color:var(--critical); font-size:14px; cursor:pointer; }
  .add-btn { margin-top: 10px; width: 100%; padding: 10px; border-radius: 12px; border: 1px dashed var(--muted); background: none; color: var(--text-secondary); font-size: 12px; font-weight: 700; cursor: pointer; }

  /* Buddy / pet page */
  .pet-stage { display: flex; align-items: center; justify-content: center; padding: 10px 0 4px; }
  .pet-body { width: 108px; height: 108px; border-radius: 50%; position: relative; display:flex; align-items:center; justify-content:center; filter: drop-shadow(0 8px 14px rgba(0,0,0,0.5)); }
  .pet-body .accessory { position:absolute; top:-22px; left:50%; transform:translateX(-50%); display:block; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.55)); }
  .swatch-row { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected { border-color: var(--accent); }
  .acc-row { display:flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .acc-btn { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); font-size: 17px; cursor: pointer; position: relative; display:flex; align-items:center; justify-content:center; min-width:42px; min-height:38px; }
  .acc-btn.selected { border-color: var(--accent); border-width: 2px; }
  .acc-btn.locked { opacity: 0.35; cursor: not-allowed; }
  .acc-btn .lock-badge { position:absolute; bottom:-5px; right:-5px; font-size: 9px; display:flex; align-items:center; gap:1px; background:var(--surface-1); border:1px solid var(--border); border-radius:7px; padding:1px 4px; color:var(--muted); font-weight:700; }
  /* Whoop-style achievement cards: icon left, a flavorful earned name up top, the literal
     criteria/progress as a small caption underneath — not just a locked/unlocked medal grid. */
  .badge-grid { display:flex; flex-direction:column; gap: 8px; margin-top: 8px; }
  .badge-item { display:flex; flex-direction:row; align-items:center; gap:11px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
  .badge-item .bic { display:flex; flex-shrink:0; }
  .badge-item.locked { opacity: 0.45; }
  .badge-item .btxt { display:flex; flex-direction:column; gap:1px; min-width:0; }
  .badge-item .btitle { font-size: 13px; font-weight: 800; color: var(--text-primary); }
  .badge-item.locked .btitle { color: var(--muted); }
  .badge-item .blbl { font-size: 10.5px; color: var(--muted); font-weight:600; }
  .badge-group { margin-top: 14px; }
  .badge-group:first-of-type { margin-top: 10px; }
  .badge-group-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }

  /* Buddy growth timeline */
  .growth-row { display:grid; grid-template-columns: repeat(4,1fr); justify-content:space-between; gap: 6px; margin-top: 10px; }
  .growth-stage { display:flex; flex-direction:column; align-items:center; gap:5px; padding: 8px 2px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
  .growth-stage.current { border-color: var(--accent); border-width: 2px; background: var(--accent-soft); }
  .growth-stage.locked .growth-avatar { opacity: 0.35; }
  .growth-stage .glbl { font-size: 8px; color: var(--muted); font-weight:700; text-transform:uppercase; text-align:center; letter-spacing:0.02em; }
  .growth-stage.current .glbl { color: var(--accent); }

  /* Full-screen check-in */
  .checkin-screen { position: absolute; inset: 0; background: var(--page); z-index: 25; display:flex; flex-direction:column; }
  .checkin-header { display:flex; align-items:center; justify-content:space-between; padding: 20px 20px 4px; flex-shrink:0; }
  .checkin-close { background:none; border:none; color: var(--muted); cursor:pointer; line-height:1; padding: 4px; display:flex; }
  .checkin-content { flex:1; overflow-y:auto; padding: 8px 24px 4px; display:flex; flex-direction:column; }
  .checkin-footer { padding: 12px 20px 26px; flex-shrink:0; }

  .step-dots { display:flex; justify-content:center; gap: 6px; margin-bottom: 8px; }
  .step-dots .sdot { width: 7px; height: 7px; border-radius:50%; background: var(--gridline); }
  .step-dots .sdot.done { background: var(--accent); }
  .step-dots .sdot.current { background: var(--accent); width:16px; border-radius:4px; }

  .q-body { flex: 1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding: 10px 0; }
  .q-icon { font-size: 42px; margin-bottom: 14px; }
  .q-text { font-size: 19px; font-weight: 800; color: var(--text-primary); line-height:1.4; margin-bottom: 30px; padding: 0 6px; }

  /* Richer pillar-step layout: live ring + yesterday comparison up top, then question, widget, follow-up chips, note */
  .q-body-rich { flex:1; display:flex; flex-direction:column; align-items:center; text-align:center; padding: 4px 0 10px; }
  .q-topline { display:flex; flex-direction:column; align-items:center; margin-bottom: 18px; }
  .live-ring-wrap { position:relative; display:inline-flex; align-items:center; justify-content:center; }
  .live-ring-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size: 26px; font-weight: 800; }
  .q-topline .plabel { font-size: 11px; font-weight: 700; letter-spacing:0.06em; text-transform:uppercase; color: var(--muted); margin-top: 8px; }
  .q-compare { font-size: 11.5px; color: var(--muted); font-weight:600; margin-top: 4px; display:flex; align-items:center; gap:5px; }
  .q-compare .ydot { width:7px; height:7px; border-radius:50%; display:inline-block; }

  function fmtDate(ts){ var d=new Date(ts); var m=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]; return m[d.getMonth()]+" "+d.getDate(); }
  function weekday(ts){ var d=new Date(ts); var wd=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"]; return wd[d.getDay()]; }
  function weekdayShort(ts){ var d=new Date(ts); var wd=["S","M","T","W","T","F","S"]; return wd[d.getDay()]; }
  function scoreOf(h, key){ return LEVELS[h[key]-1].score; }
  function compositeScoreOf(h){ var s=0; PILLARS.forEach(function(p){s+=scoreOf(h,p.key);}); return Math.round(s/PILLARS.length); }
  function zoneOf(score){ if(score>=70) return {name:"Green", color:"var(--good)"}; if(score>=40) return {name:"Yellow", color:"var(--warning)"}; return {name:"Red", color:"var(--critical)"}; }
  function fmtTime(t){ var p=t.split(":"); var h=parseInt(p[0],10),m=p[1]; var ap=h>=12?"PM":"AM"; var h12=h%12; if(h12===0)h12=12; return h12+":"+m+" "+ap; }

  function avgScoreLastN(n, key){
    var arr = state.history.slice(-n); if(!arr.length) return 0;
    var s=0; arr.forEach(function(h){ s += key ? scoreOf(h,key) : compositeScoreOf(h); });
    return s/arr.length;
  }
  function bestWeekdayFor(key){
    var sums={},counts={};
    state.history.forEach(function(h){ var wd=weekday(h.ts); var v = key?scoreOf(h,key):compositeScoreOf(h); sums[wd]=(sums[wd]||0)+v; counts[wd]=(counts[wd]||0)+1; });
    var best=null,bestAvg=-1;
    Object.keys(sums).forEach(function(k){ var avg=sums[k]/counts[k]; if(avg>bestAvg){bestAvg=avg;best=k;} });
    return best;
  }
  function weakestPillar(){
    var lowest=null, lowestAvg=999;
    PILLARS.forEach(function(p){ var avg=avgScoreLastN(7,p.key); if(avg<lowestAvg){lowestAvg=avg;lowest=p;} });
    return lowest;
  }
  function strongestPillar(){
    var top=null, topAvg=-1;

    return top;
  }
  // Week-over-week change, used to compute real (not fabricated) pattern alerts.
  function weekOverWeekDelta(key){
    var last7 = state.history.slice(-7);
    var prev7 = state.history.slice(-14,-7);
    if(prev7.length < 7) return null;
    function avg(arr){ var s=0; arr.forEach(function(h){ s += key ? scoreOf(h,key) : compositeScoreOf(h); }); return s/arr.length; }
    return Math.round(avg(last7) - avg(prev7));
  }
  // Simple, explainable pattern detection over real check-in history — this is the kind
  // of logic a real backend would run (optionally calling an LLM) to decide what's worth
  // surfacing as a notification, rather than checking in on a fixed timer.
  function detectAlerts(){
    var alerts = [];
    PILLARS.forEach(function(p){
      var delta = weekOverWeekDelta(p.key);
      if(delta !== null && delta <= -12){
        alerts.push({ icon:p.icon, severity:"warn",
          text: p.label+" dropped "+Math.abs(delta)+" points versus last week — worth keeping an eye on.",
          time: "Today" });
      }
    });
    var compDelta = weekOverWeekDelta(null);
    if(compDelta !== null && compDelta <= -10){
      alerts.push({ icon:"", severity:"warn", text:"Overall wellbeing is down "+Math.abs(compDelta)+" points from last week across all four pillars combined.", time:"Today" });
    } else if(compDelta !== null && compDelta >= 10){
      alerts.push({ icon:"", severity:"good", text:"Overall wellbeing is up "+compDelta+" points from last week — whatever changed, it's working.", time:"Today" });
    }
    if(state.streak >= 5 && state.streak === state.longestStreak){
      alerts.push({ icon:"", severity:"good", text:"You're on your longest streak yet at "+state.streak+" days.", time:"Today" });
    }
    if(!alerts.length){
      alerts.push({ icon:"", severity:"good", text:"No concerning patterns detected this week — all four pillars are steady.", time:"Today" });
    }
    return alerts;
  }
  // ---- Sparse-data insights (1-2 check-ins) — a single day can't show a real trend, but it

  // ---- Action Plan library — one clear, doable action per pillar, each grounded in the

  // Determination Theory, adolescent sleep/stress research). Multiple action variants per
  // pillar so "show another idea" surfaces genuinely different, still-valid suggestions —
  // that's browsing options, not a random reward, so it doesn't conflict with the app's

  var ACTION_LIBRARY = {
    energy: {

        "Write down the one thing causing the most pressure right now — naming a stressor measurably reduces how intense it feels.",

        "Reach out to one teammate today — connection with others is a proven lever for rebuilding motivation.",

  // Back-compat shorthand used by the sparse-data narrative below.

  function extremePillarInEntry(h, findMax){
    var picked=null, pickedScore=findMax?-1:999;
    PILLARS.forEach(function(p){
      var s = scoreOf(h,p.key);
      if((findMax && s>pickedScore) || (!findMax && s<pickedScore)){ pickedScore=s; picked=p; }
    });

  }
  function sparseDataFallback(){
    var latest = state.history[state.history.length-1];

    var n = state.history.length;
    var alerts = [{
      icon: weak.pillar.icon,
      severity: weak.score < 55 ? "warn" : "good",

    }];

    return { alerts: alerts, narrative: narrative };
  }
  function generateWellbeingNarrative(){
    var avg14 = Math.round(avgScoreLastN(14));
    var delta = weekOverWeekDelta(null);
    var strong = strongestPillar(), weak = weakestPillar();
    var trendWord = delta===null ? "holding steady" : (delta>3 ? "trending upward" : (delta<-3 ? "trending downward" : "holding steady"));
    var deltaText = delta===null ? "" : (delta>0 ? " ("+"+"+delta+" pts vs. the week before)" : (delta<0 ? " ("+delta+" pts vs. the week before)" : " (flat vs. the week before)"));
    return "Over the last 14 days your overall wellbeing has averaged <strong>"+avg14+"/100</strong>, "+trendWord+deltaText+". "+
      "<strong>"+strong.label+"</strong> has been your strongest pillar, while <strong>"+weak.label+"</strong> has been your lowest — that's the one worth focusing on this week. "+
      "You're currently on a <strong>"+state.streak+"-day</strong> check-in streak"+(state.streak>=state.longestStreak-2 && state.streak<state.longestStreak ? ", closing in on your all-time best" : "")+".";

  // ---- Training-load spike detection (Gabbett, 2016): a sudden jump in recent load vs.
  // your typical load — not just "training hard" — is what's associated with injury risk.
  // Simplified acute:chronic workload ratio using last 3 sessions vs. last up to 10.
  function acuteChronicRatio(){
    var logs = state.practiceLogs.slice().sort(function(a,b){ return a.ts-b.ts; });
    if(logs.length < 4) return null;
    function avgLoad(arr){ var s=0; arr.forEach(function(e){ s+=e.load; }); return s/arr.length; }
    var chronic = avgLoad(logs.slice(-10));
    if(!chronic) return null;
    return avgLoad(logs.slice(-3)) / chronic;
  }
  function loadTrendZone(){
    var r = acuteChronicRatio();
    if(r===null) return null;
    if(r>=1.5) return { name:"Elevated", color:"var(--critical)", note:"Your last few sessions are running notably higher than your recent average — that kind of load spike is linked to higher injury risk (Gabbett, 2016), so recovery matters extra right now." };
    if(r<0.8) return { name:"Light", color:"var(--warning)", note:"Recent training load is lower than your typical average — could be planned rest, or worth checking nothing's keeping you from training." };
    return { name:"Sustainable", color:"var(--good)", note:"Recent training load is holding in a steady, sustainable range relative to your own recent average." };
  }

  function showToast(msg, ms){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._timer); t._timer=setTimeout(function(){t.classList.remove("show");}, ms||2600); }

  function ringSvg(score, size, stroke, showText, colorOverride){

    var zone = zoneOf(score);
    var color = colorOverride || zone.color;
    var text = showText ? '<text x="'+c+'" y="'+(c+ (size*0.09) )+'" text-anchor="middle" font-size="'+Math.round(size*0.26)+'" font-weight="800" fill="var(--text-primary)">'+Math.round(score)+'</text>' : "";
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">' +
      '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+stroke+'"/>' +
      '<circle cx="'+c+'" cy="'+c+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+dash+' '+circ+'" transform="rotate(-90 '+c+' '+c+')"/>' +

  // ---------- AI Insights ----------
  // Tries the real backend (server.js, see the bloom-backend folder) first, which calls

  // rule-based version so this file still works as a standalone demo on its own.
  var AI_BACKEND_URL = "https://bloom-backend-rv0g.onrender.com/api/insights";
  var AI_FOLLOWUP_URL = "https://bloom-backend-rv0g.onrender.com/api/followup";
  var AI_TALK_URL = "https://bloom-backend-rv0g.onrender.com/api/talk";
  var TALK_DAILY_LIMIT = 25; // lightweight, disclosed cost/abuse guard — not a punishment, just a practical cap on a real paid API key

  // ---------- Check-in "what's contributing?" follow-up, Claude-generated per answer ----------
  // Fired the moment an athlete picks a value for a pillar. Claude decides the question AND
  // the chip options (or that there should be no follow-up at all) based on the actual score
  // — see the FOLLOWUP_SYSTEM_PROMPT in bloom-backend/server.js. If the backend isn't running,
  // this falls back to the science-grounded local map above instead of silently doing nothing.
  function scheduleFollowupRequest(pillarKey, val){
    setTimeout(function(){ requestFollowup(pillarKey, val); }, 0);
  }
  function applyFollowup(pillarKey, val, result){
    var current = state.checkin.followup[pillarKey];
    if(!current || current.forVal !== val) return; // answer changed again before this resolved
    state.checkin.followup[pillarKey] = { forVal: val, loading:false, question: result.question, chips: result.chips, skip: !!result.skip, source: result.source };
    var p = pillarByKey(pillarKey);
    var stepForKey = PILLARS.indexOf(p) + 1;
    if(state.checkin.step === stepForKey && document.getElementById("checkinScreen")) renderCheckinScreen();
  }
  function requestFollowup(pillarKey, val){
    var p = pillarByKey(pillarKey);
    var label = p.labels[val-1];
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 2500);
    fetch(AI_FOLLOWUP_URL, {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({ pillar: p.key, pillarLabel: p.label, value: val, label: label }),
      signal: controller.signal
    })
    .then(function(r){ if(!r.ok) throw new Error("backend responded "+r.status); return r.json(); })
    .then(function(data){
      clearTimeout(timeout);
      if(typeof data.question !== "string" || !Array.isArray(data.chips)) throw new Error("unexpected shape");
      applyFollowup(pillarKey, val, { question:data.question, chips:data.chips.slice(0,5), skip:!!data.skip, source:"live" });
    })
    .catch(function(){
      clearTimeout(timeout);
      var fb = localFollowupFallback(pillarKey, val);
      applyFollowup(pillarKey, val, { question:fb.question, chips:fb.chips, skip:fb.skip, source:"local" });
    });
  }

    });

  // ---- AI Insights is now two distinct sections, switchable via a segmented control:
  // "Patterns" (the existing trend/alert detection, live-AI or local fallback) and

  function actionPlanFocus(){

  function renderActionPlanBody(){

    var p = focus.pillar;
    var lib = ACTION_LIBRARY[p.key];

    var scopeLabel = focus.mode==="trend" ? "This week's focus" : "Right now";
    return (
      '<div class="card" style="text-align:center;">' +
        '<div style="display:flex;justify-content:center;margin-bottom:8px;">'+ringSvg(focus.score, 64, 7, true)+'</div>' +
        '<div style="font-size:11px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);">'+scopeLabel+'</div>' +

  function fetchInsightsData(){
    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 3000);
    fetch(AI_BACKEND_URL, {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({ history: historyForBackend(), streak: state.streak, longestStreak: state.longestStreak }),
      signal: controller.signal
    })
    .then(function(r){ if(!r.ok) throw new Error("backend responded "+r.status); return r.json(); })
    .then(function(data){
      clearTimeout(timeout);
      if(!state.showInsights) return; // user navigated away before this resolved
      if(!Array.isArray(data.alerts) || typeof data.narrative !== "string") throw new Error("unexpected shape");
      state.insightsData = { alerts: data.alerts, narrative: data.narrative, source: "live" };
      if(state.insightsSubTab === "patterns") renderInsightsView();
    })
    .catch(function(){
      clearTimeout(timeout);
      if(!state.showInsights) return;
      var alerts, narrative;
      if(state.history.length < 3){
        var sd = sparseDataFallback();
        alerts = sd.alerts; narrative = sd.narrative;
      } else {
        alerts = detectAlerts(); narrative = generateWellbeingNarrative();
      }
      state.insightsData = { alerts: alerts, narrative: narrative, source: "local" };
      if(state.insightsSubTab === "patterns") renderInsightsView();
    });
  }

  // ---------- Talk to Bloom — open-ended chat, scoped to athletic wellbeing (see
  // server.js's TALK_SYSTEM_PROMPT for the actual guardrails: never diagnoses, redirects
  // off-topic requests, and treats anything resembling a real crisis as something to hand
  // off to a real person, not something to keep chatting through). ----------
  var TALK_STARTERS = [
    "I'm nervous about a game coming up",
    "I haven't been sleeping well",
    "I'm feeling burnt out"
  ];
  var CRISIS_LINE_TEXT = "call or text 988 (Suicide & Crisis Lifeline), or text HOME to 741741 (Crisis Text Line)";

  function resetTalkQuotaIfNewDay(){
    var today = localDayKey(Date.now());
    if(state.talk.dayKey !== today){ state.talk.dayKey = today; state.talk.countToday = 0; }
  }
  function openTalk(){ resetTalkQuotaIfNewDay(); state.showTalk = true; render(); scrollTalkToBottom(); }
  function closeTalk(){ state.showTalk = false; render(); }
  function scrollTalkToBottom(){
    var m = document.querySelector(".talk-messages");
    if(m) m.scrollTop = m.scrollHeight;
  }
  function recentContextForTalk(){
    if(!state.history.length) return null;
    var latest = state.history[state.history.length-1];
    return { energy: scoreOf(latest,"energy"), stress: scoreOf(latest,"stress"), sleep: scoreOf(latest,"sleep"), motivation: scoreOf(latest,"motivation") };
  }
  function sendTalkMessage(text){
    text = (text||"").trim();
    if(!text || state.talk.sending) return;
    resetTalkQuotaIfNewDay();
    if(state.talk.countToday >= TALK_DAILY_LIMIT) return;
    var priorHistory = state.talk.messages.map(function(m){ return { role: m.role, text: m.text }; });
    state.talk.messages.push({ role:"user", text: text });
    state.talk.countToday += 1;
    state.talk.everUsed = true;
    state.talk.sending = true;
    render(); scrollTalkToBottom();

    var controller = new AbortController();
    var timeout = setTimeout(function(){ controller.abort(); }, 12000);
    fetch(AI_TALK_URL, {
      method: "POST",
      headers: {"content-type":"application/json"},
      body: JSON.stringify({ message: text, history: priorHistory, recentContext: recentContextForTalk() }),
      signal: controller.signal
    })
    .then(function(r){ if(!r.ok) throw new Error("backend responded "+r.status); return r.json(); })
    .then(function(data){
      clearTimeout(timeout);
      if(typeof data.reply !== "string") throw new Error("unexpected shape");
      state.talk.messages.push({ role:"bloom", text: data.reply, concern: !!data.concern });
      state.talk.sending = false;
      render(); scrollTalkToBottom();
    })
    .catch(function(){
      clearTimeout(timeout);
      state.talk.messages.push({
        role:"bloom",
        text: "Bloom's AI is taking a quick break right now — try again in a minute. If you ever need to talk to someone right now, a trusted adult, school counselor, or "+CRISIS_LINE_TEXT+" are always there.",
        concern: false
      });
      state.talk.sending = false;
      render(); scrollTalkToBottom();
    });
  }
  function talkBubbleHtml(m){
    if(m.role === "user"){
      return '<div class="talk-row user"><div class="talk-bubble">'+escapeHtml(m.text)+'</div></div>';
    }
    var resource = m.concern ? (
      '<div class="talk-resource-card"><span class="tric">'+alertTriangleIconSvg(18)+'</span>' +
      '<div class="trtext"><strong>If this feels urgent, please reach out now</strong>A trusted adult, a school counselor, or '+CRISIS_LINE_TEXT+' can help right away — Bloom is a wellbeing tool, not a substitute for real support.</div></div>'
    ) : "";
    return '<div class="talk-row bloom"><div class="talk-bubble">'+escapeHtml(m.text)+'</div></div>' + resource;
  }
  function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function renderTalkView(){
    resetTalkQuotaIfNewDay();
    var el = document.getElementById("view-talk");
    var atLimit = state.talk.countToday >= TALK_DAILY_LIMIT;
    var messagesHtml =
      '<div class="ai-banner">Talk to Bloom is an AI feature, not a therapist or doctor. If you\'re in crisis, '+CRISIS_LINE_TEXT+', any time.</div>' +
      (state.talk.messages.length === 0 ?
        '<div class="talk-starter-row">' + TALK_STARTERS.map(function(s){ return '<span class="chip" data-starter="'+encodeURIComponent(s)+'">'+s+'</span>'; }).join("") + '</div>'
        : "") +
      state.talk.messages.map(talkBubbleHtml).join("") +
      (state.talk.sending ? '<div class="talk-row bloom"><div class="talk-bubble talk-typing"><span></span><span></span><span></span></div></div>' : "");
    var composerHtml = atLimit
      ? '<div class="talk-input-row"><div class="ai-banner" style="margin:0;flex:1;">You\'ve reached today\'s chat limit. Try Action Plan for another idea, or come back tomorrow.</div></div>'
      : '<div class="talk-input-row"><textarea id="talkInput" placeholder="Tell me what\'s going on…" rows="1" '+(state.talk.sending?"disabled":"")+'></textarea><button class="talk-send-btn" id="talkSendBtn" '+(state.talk.sending?"disabled":"")+'>'+sendIconSvg(18)+'</button></div>';
    el.innerHTML =
      '<div class="back-row" id="talkBack" style="margin:2px 20px 6px;flex-shrink:0;"><span class="arrow">'+chevronLeftIconSvg(18)+'</span><span class="btitle">Talk to Bloom</span></div>' +
      '<div class="talk-messages" style="padding-left:20px;padding-right:20px;">'+messagesHtml+'</div>' +
      composerHtml;
    document.getElementById("talkBack").onclick = closeTalk;
    el.querySelectorAll("[data-starter]").forEach(function(c){
      c.onclick = function(){
        var ta = document.getElementById("talkInput");
        if(ta){ ta.value = decodeURIComponent(c.getAttribute("data-starter")); ta.focus(); }
      };
    });
    var sendBtn = document.getElementById("talkSendBtn");
    var input = document.getElementById("talkInput");
    if(sendBtn && input){
      sendBtn.onclick = function(){ sendTalkMessage(input.value); };
      input.onkeydown = function(e){ if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendTalkMessage(input.value); } };
    }
    scrollTalkToBottom();
  }

  function renderPracticeLog(){

    if(!logs.length){
      el.innerHTML =

    }
    var zone = loadTrendZone();
    var last7 = logs.slice(-7);
    var avgLoad7 = last7.length ? Math.round(last7.reduce(function(s,e){ return s+e.load; },0)/last7.length) : 0;
    var maxLoad = Math.max.apply(null, logs.map(function(e){ return e.load; }).concat([1]));

    var bars = logs.slice(-10).map(function(e){

          '<span style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;">'+fmtDate(e.ts)+(e.sessionType?' · '+e.sessionType:'')+'</span>' +

          '<span>·</span><span style="display:inline-flex;align-items:center;gap:3px;">'+practiceIconSvg("rpe")+' RPE '+e.rpe+'</span>' +
          '<span>·</span><span style="display:inline-flex;align-items:center;gap:3px;">'+practiceIconSvg("recovery")+' Recovery '+e.recovery+'</span>' +
          '<span>·</span><span style="display:inline-flex;align-items:center;gap:3px;">'+practiceIconSvg("soreness")+' Soreness '+e.soreness+'</span>' +
        '</div>' +
        (e.focusTags && e.focusTags.length ? '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;">' +
          e.focusTags.map(function(t){ return '<span style="font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;">'+t+'</span>'; }).join("") +
        '</div>' : '') +
        (e.goal ? '<div style="font-size:11.5px;color:var(--text-secondary);background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:6px;">' +
          '<strong style="color:var(--text-primary);">Goal:</strong> "'+e.goal.text+'" — '+GOAL_REFLECT_LABELS[e.goal.rating-1]+
          (e.goal.note ? ' — '+e.goal.note : '') + '</div>' : '') +
        (e.note ? '<p>'+e.note+'</p>' : '') +
      '</div>';
    }).join("");

    el.innerHTML =
      '<div class="back-row" id="practiceLogBack"><span class="arrow">'+chevronLeftIconSvg(18)+'</span><span class="btitle">Training Load</span></div>' +
      (zone
        ? '<div class="ai-banner" style="border-color:'+zone.color+';">'+zone.note+'</div>'
        : '<div class="ai-banner">Log a few more sessions and Bloom will start flagging load spikes automatically — sudden jumps in training load are linked to higher injury risk (Gabbett, 2016).</div>') +
      '<div class="stat-grid">' + statTile(logs.length,"Sessions logged") + statTile(avgLoad7,"7-session avg load") + '</div>' +
      '<div class="card"><h3>Load, last '+Math.min(10,logs.length)+' sessions</h3><div class="week-strip">'+bars+'</div>' +
        '<div class="insight">Session load = duration × session-RPE (Foster\'s method). Taller, redder bars mean bigger, harder sessions.</div></div>' +

      : '<div class="card"><h3>Needs attention</h3><p>Check in for a few days and Bloom will show which pillar needs the most attention.</p></div>';

      attentionCard +
      loadCard +
      cards;
    el.querySelectorAll(".card[data-pillar]").forEach(function(c){ c.onclick=function(){ openPillar(c.getAttribute("data-pillar")); }; });

  }
  function statTile(val,lbl){ return '<div class="stat-tile"><div class="val">'+val+'</div><div class="lbl">'+lbl+'</div></div>'; }

  function drawTable(key){
    var wrap = document.getElementById("chartWrap");
    if(!state.history.length){
      wrap.innerHTML = '<div class="insight" style="padding:20px 0;text-align:center;">No check-ins logged yet.</div>';
      return;
    }
    var rows = state.history.map(function(h){ return '<tr><td>'+fmtDate(h.ts)+'</td><td>'+scoreOf(h,key)+'</td><td>'+(h.note||"—")+'</td></tr>'; }).join("");
    wrap.innerHTML = '<table class="data-table"><thead><tr><th>Date</th><th>Score</th><th>Note</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }

  function drawChart(key){
    var wrap = document.getElementById("chartWrap");
    var data = state.history;
    var W=320,H=140,padL=26,padR=8,padT=12,padB=20;
    var plotW=W-padL-padR, plotH=H-padT-padB;
    var n=data.length, xStep=plotW/(n-1);
    function xAt(i){ return padL+i*xStep; }
    function yAt(v){ return padT+plotH-(v/100)*plotH; }
    var gridLines="";
    [0,25,50,75,100].forEach(function(v){ var y=yAt(v); gridLines+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="var(--gridline)" stroke-width="1"/>'; });
    var pathD = data.map(function(h,i){ return (i===0?"M":"L")+xAt(i).toFixed(1)+","+yAt(scoreOf(h,key)).toFixed(1); }).join(" ");
    var points = data.map(function(h,i){ return '<circle cx="'+xAt(i).toFixed(1)+'" cy="'+yAt(scoreOf(h,key)).toFixed(1)+'" r="4" fill="var(--series-1)" stroke="var(--surface-1)" stroke-width="2"></circle>'; }).join("");
    var last = data[n-1];
    var lastLabel = '<text x="'+xAt(n-1).toFixed(1)+'" y="'+(yAt(scoreOf(last,key))-10).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="800" fill="var(--text-primary)">'+scoreOf(last,key)+'</text>';
    wrap.innerHTML =
      '<svg class="linechart" viewBox="0 0 '+W+' '+H+'" id="lineSvg">'+gridLines+
      '<line x1="'+padL+'" y1="'+(padT+plotH)+'" x2="'+(W-padR)+'" y2="'+(padT+plotH)+'" stroke="var(--baseline)" stroke-width="1"/>'+
      '<path d="'+pathD+'" fill="none" stroke="var(--series-1)" stroke-width="2"/>'+points+lastLabel+
      '<line id="crosshair" x1="0" y1="'+padT+'" x2="0" y2="'+(padT+plotH)+'" stroke="var(--muted)" stroke-width="1" opacity="0"/></svg>'+
      '<div class="tooltip" id="chartTooltip"></div>';
    var svgEl=document.getElementById("lineSvg"), tooltip=document.getElementById("chartTooltip"), crosshair=document.getElementById("crosshair");
    function showPoint(i){ var h=data[i]; crosshair.setAttribute("x1",xAt(i)); crosshair.setAttribute("x2",xAt(i)); crosshair.setAttribute("opacity","1"); tooltip.style.opacity="1"; tooltip.style.left=((xAt(i)/W)*100)+"%"; tooltip.style.top=((yAt(scoreOf(h,key))/H)*100)+"%"; tooltip.innerHTML="<strong>"+fmtDate(h.ts)+"</strong><br>Score "+scoreOf(h,key)+(h.note?"<br>"+h.note:""); }
    function hidePoint(){ crosshair.setAttribute("opacity","0"); tooltip.style.opacity="0"; }
    svgEl.addEventListener("mousemove", function(e){ var rect=svgEl.getBoundingClientRect(); var x=((e.clientX-rect.left)/rect.width)*W; var i=Math.round((x-padL)/xStep); if(i<0)i=0; if(i>n-1)i=n-1; showPoint(i); });
    svgEl.addEventListener("mouseleave", hidePoint);
  }

          '<span style="font-weight:800;font-size:15px;color:var(--text-primary);">'+state.pet.name+'</span>' +
          '<span class="lvl">LV '+lvl+'</span>' +
        '</div>' +
        '<div style="font-size:12px;color:var(--muted);margin-top:4px;">'+petStatusText()+'</div>' +
        '<div class="xp-track" style="margin-top:10px;"><div class="xp-fill" style="width:'+xp+'%"></div></div>' +
        '<div style="font-size:10px;color:var(--muted);margin-top:4px;">'+xp+' / 100 XP to level '+(lvl+1)+'</div>' +
      '</div>' +
      '<div class="card"><h3>Growth</h3><p>'+state.pet.name+' evolves as your <strong style="color:var(--text-primary);">longest-ever streak</strong> grows — never based on today alone, so a missed day never undoes progress. Stages are fixed and shown here up front, not random drops.</p><div class="growth-row">'+growthStages+'</div></div>' +

      '<div class="card"><h3>Badges — '+earnedBadgeCount+' / '+BADGES.length+' earned</h3><p>Different goals, different badges — check-ins, training logged, journaling, coming back after a miss, and Talk to Bloom all have their own.</p>'+badgeGroupsHtml+'</div>';

    document.getElementById("petNameInput").onchange = function(e){ state.pet.name = e.target.value || "Buddy"; render(); };

  // ---------- Check-in: full-screen, one question per screen, distinct widget per pillar,
  // with an optional note field available on every step (not just the end). ----------
  var CHECKIN_STEPS = PILLARS.length + 1; // 4 pillars + final wrap-up note

  function openCheckin(){
    state.checkin = {
      step: 1,
      answers: {energy:null, stress:null, sleep:null, motivation:null},
      tags: {energy:[], stress:[], sleep:[], motivation:[]},
      notes: {energy:"", stress:"", sleep:"", motivation:""},
      noteOpen: {energy:false, stress:false, sleep:false, motivation:false},
      followup: {energy:null, stress:null, sleep:null, motivation:null},
      note: ""
    };
    renderCheckinScreen();
  }
  function closeCheckin(){ var b=document.getElementById("checkinScreen"); if(b) b.remove(); }
  function currentPillarForStep(step){ return PILLARS[step-1]; }
  function yesterdayEntry(){ return state.history[state.history.length-1] || null; }
  function liveScoreFor(val){ return val ? LEVELS[val-1].score : 0; }
  function liveRingHtml(val){
    var score = liveScoreFor(val);
    var color = val ? null : "var(--gridline)";
    var textColor = val ? "var(--text-primary)" : "var(--muted)";
    var textVal = val ? score : "–";
    return '<div class="live-ring-wrap">' + ringSvg(score, 92, 10, false, color) + '<div class="live-ring-text" style="color:'+textColor+'">'+textVal+'</div></div>';
  }

  function stepDotsHtml(){
    var dots = "";
    for(var i=1;i<=CHECKIN_STEPS;i++){
      var cls = i < state.checkin.step ? "done" : (i===state.checkin.step ? "current" : "");
      dots += '<span class="sdot '+cls+'"></span>';
    }
    return '<div class="step-dots">'+dots+'</div>';
  }

  function renderCheckinScreen(){
    var existing=document.getElementById("checkinScreen"); if(existing) existing.remove();
    var screen=document.createElement("div"); screen.className="checkin-screen"; screen.id="checkinScreen";
    var step = state.checkin.step;

    var header = '<div class="checkin-header">' + stepDotsHtml() + '<button class="checkin-close" id="closeCheckin">'+closeIconSvg(20)+'</button></div>';
    var body = "", footer = "";

    if(step <= PILLARS.length){
      var p = currentPillarForStep(step);
      var val = state.checkin.answers[p.key];
      var noteOpen = state.checkin.noteOpen[p.key] || !!state.checkin.notes[p.key];
      var yEntry = yesterdayEntry();
      var yLevel = yEntry ? yEntry[p.key] : null;
      var yZone = yLevel ? zoneOf(LEVELS[yLevel-1].score) : null;

      body += '<div class="q-body-rich">';

      // Live ring preview, tied to the same ring visual language as the rest of the app,
      // plus a same-pillar comparison against yesterday's answer.
      body += '<div class="q-topline">' +
        '<div id="liveRingOuter">' + liveRingHtml(val) + '</div>' +
        '<div class="plabel">'+p.icon+' '+p.label+'</div>' +
        (yLevel ? '<div class="q-compare"><span class="ydot" style="background:'+yZone.color+'"></span>Yesterday: '+p.labels[yLevel-1]+'</div>' : '') +
      '</div>';

      body += '<div class="q-text-rich">'+p.question+'</div>';

      if(p.widget === "emoji"){
        var btns = p.labels.map(function(lbl, idx){
          var v = idx+1;
          return '<button class="emoji-btn '+(val===v?"selected":"")+'" data-val="'+v+'"><span class="elvl">'+levelBarsSvg(v, 24)+'</span><span class="elbl">'+lbl+'</span></button>';
        }).join("");
        body += '<div class="emoji-row">'+btns+'</div>';
      } else if(p.widget === "slider"){
        var sliderVal = val || 3;
        body += '<div class="slider-wrap">' +
          '<div class="slider-caption" id="sliderCaption">'+(val?p.labels[val-1]:"Slide to answer")+'</div>' +
          '<input type="range" class="pillar-range" id="pillarRange" min="1" max="5" step="1" value="'+sliderVal+'">' +
          '<div class="slider-endlabels"><span>Overloaded</span><span>Fully charged</span></div>' +
        '</div>';
      } else if(p.widget === "rating"){
        var icons = [1,2,3,4,5].map(function(v){
          return '<button class="rating-icon '+(val && v<=val ? "filled":"")+'" data-val="'+v+'">'+p.ratingIcon+'</button>';
        }).join("");
        body += '<div class="rating-row">'+icons+'</div><div class="rating-caption">'+(val?p.labels[val-1]:"")+'</div>';
      }

      if(val){
        var fu = state.checkin.followup[p.key];
        if(!fu || fu.forVal !== val){
          // New or changed answer — show a loading state immediately and kick off the real
          // request (Claude live if the backend's running, science-grounded local map if not).
          state.checkin.followup[p.key] = { forVal: val, loading:true, question:null, chips:[], skip:false, source:null };
          fu = state.checkin.followup[p.key];
          scheduleFollowupRequest(p.key, val);
        }
        if(fu.loading){
          body += '<div class="chip-section"><div class="chip-prompt thinking">Thinking about what fits…</div></div>';
        } else if(!fu.skip){
          var chipBtns = fu.chips.map(function(c){
            var selected = state.checkin.tags[p.key].indexOf(c) !== -1;
            return '<button class="chip '+(selected?"selected":"")+'" data-chip="'+c+'">'+c+'</button>';
          }).join("");
          body += '<div class="chip-section"><div class="chip-prompt">'+fu.question+' (optional)</div><div class="chip-row">'+chipBtns+'</div></div>';
        }
      }

      if(noteOpen){
        body += '<div class="note-area-wrap"><textarea id="pillarNoteInput" placeholder="Add anything else about this — optional">'+state.checkin.notes[p.key]+'</textarea></div>';
      } else {
        body += '<button class="note-toggle" id="noteToggleBtn">+ Add a note</button>';
      }
      body += '</div>';

      footer = '<div class="modal-actions">' +
        (step>1 ? '<button class="btn-secondary" id="backCheckin">Back</button>' : '') +
        '<button class="btn-primary" id="nextCheckin" '+(val?"":"disabled")+'>Next</button>' +
      '</div>';
    } else {
      body += '<div class="q-body" style="justify-content:flex-start;padding-top:20px;">' +
        '<div class="q-text">Anything else you want to add about today?</div>' +
        '<textarea id="noteInput" placeholder="Type as much or as little as you want… or skip" style="min-height:140px;">'+state.checkin.note+'</textarea>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-secondary" id="backCheckin">Back</button><button class="btn-primary" id="submitCheckin">Finish check-in</button></div>';
    }

    screen.innerHTML = header + '<div class="checkin-content">'+body+'</div>' + '<div class="checkin-footer">'+footer+'</div>';
    document.getElementById("phone").appendChild(screen);
    document.getElementById("closeCheckin").onclick = closeCheckin;

    if(step <= PILLARS.length){
      var p2 = currentPillarForStep(step);
      if(p2.widget === "emoji"){
        screen.querySelectorAll(".emoji-btn").forEach(function(b){
          b.onclick=function(){ state.checkin.answers[p2.key]=parseInt(b.getAttribute("data-val"),10); renderCheckinScreen(); };
        });
      } else if(p2.widget === "slider"){
        var range = document.getElementById("pillarRange"), cap = document.getElementById("sliderCaption"), liveRingOuter = document.getElementById("liveRingOuter");
        range.oninput = function(){
          var v=parseInt(range.value,10);
          cap.textContent = p2.labels[v-1];
          state.checkin.answers[p2.key]=v;
          document.getElementById("nextCheckin").disabled=false;
          liveRingOuter.innerHTML = liveRingHtml(v);
        };
        range.onchange = function(){ renderCheckinScreen(); }; // reveal chips + full state once the user lets go
      } else if(p2.widget === "rating"){
        screen.querySelectorAll(".rating-icon").forEach(function(b){
          b.onclick=function(){ state.checkin.answers[p2.key]=parseInt(b.getAttribute("data-val"),10); renderCheckinScreen(); };
        });
      }
      var noteToggle = document.getElementById("noteToggleBtn");
      if(noteToggle) noteToggle.onclick = function(){ state.checkin.noteOpen[p2.key] = true; renderCheckinScreen(); };
      var pillarNoteInput = document.getElementById("pillarNoteInput");
      if(pillarNoteInput) pillarNoteInput.oninput = function(e){ state.checkin.notes[p2.key] = e.target.value; };
      screen.querySelectorAll(".chip").forEach(function(c){
        c.onclick = function(){
          var arr = state.checkin.tags[p2.key];
          var val2 = c.getAttribute("data-chip");
          var idx = arr.indexOf(val2);
          if(idx===-1) arr.push(val2); else arr.splice(idx,1);
          renderCheckinScreen();
        };
      });

      var backBtn = document.getElementById("backCheckin"); if(backBtn) backBtn.onclick = function(){ state.checkin.step--; renderCheckinScreen(); };
      document.getElementById("nextCheckin").onclick = function(){ if(!state.checkin.answers[p2.key]) return; state.checkin.step++; renderCheckinScreen(); };
    } else {
      document.getElementById("noteInput").oninput=function(e){ state.checkin.note=e.target.value; };
      document.getElementById("backCheckin").onclick=function(){ state.checkin.step--; renderCheckinScreen(); };
      document.getElementById("submitCheckin").onclick=submitCheckin;
    }
  }

  function submitCheckin(){
    var a = state.checkin.answers, notes = state.checkin.notes, tags = state.checkin.tags, note = state.checkin.note;
    // Combine per-question tags/notes with the general note into one readable log entry.
    var parts = [];
    PILLARS.forEach(function(p){
      var bits = [];
      if(tags[p.key] && tags[p.key].length) bits.push(tags[p.key].join(", "));
      if(notes[p.key]) bits.push(notes[p.key]);
      if(bits.length) parts.push(p.label+": "+bits.join(" — "));
    });
    if(note) parts.push(note);
    var combinedNote = parts.join(" · ");

    var now = Date.now();
    var prevEntry = state.history.length ? state.history[state.history.length-1] : null;
    var stageBefore = petStage();
    var earnedBadgesBefore = BADGES.filter(function(b){ return b.test(); }).map(function(b){ return b.id; });
    state.history.push({ts:now, energy:a.energy, stress:a.stress, sleep:a.sleep, motivation:a.motivation, note:combinedNote});
    // Honest streak logic: only extends the streak if the previous check-in was exactly
    // yesterday. Miss a day (or more) and it resets to 1 instead of silently continuing.
    if(prevEntry && daysBetweenLocal(prevEntry.ts, now) === 1){ state.streak += 1; } else { state.streak = 1; }
    state.checkedInToday=true; if(state.streak>state.longestStreak) state.longestStreak=state.streak;
    var earned=10; if(state.streak>1) earned+=5; state.points+=earned;
    closeCheckin();
    var stageAfter = petStage();
    var milestoneMsg="";
    if(state.streak===5) milestoneMsg=" 5-day streak! +25 bonus points.";
    if(state.streak===10) milestoneMsg=" 10-day streak! +50 bonus points.";
    if(state.streak===5||state.streak===10) state.points += (state.streak===5?25:50);
    // Generalized against ACCESSORIES so every unlock threshold in that list — not just a
    // couple hardcoded ones — surfaces this message automatically.
    var justUnlockedAcc = ACCESSORIES.filter(function(a){ return a.unlockStreak===state.streak; })[0];
    if(justUnlockedAcc) milestoneMsg += " New accessory unlocked!";
    var newlyEarnedBadges = BADGES.filter(function(b){ return earnedBadgesBefore.indexOf(b.id)===-1 && b.test(); });
    if(newlyEarnedBadges.length) milestoneMsg += (newlyEarnedBadges.length===1 ? " New badge earned — "+newlyEarnedBadges[0].label+"!" : " "+newlyEarnedBadges.length+" new badges earned!");
    render();
    // A stage change is its own moment — surface it distinctly rather than folding it into
    // the routine points toast, since this is the "visible growth" payoff the whole Buddy
    // system is built around.
    if(stageAfter > stageBefore){
      var newStage = EVOLUTION_STAGES[stageAfter];
      showToast(state.pet.name+" evolved — "+newStage.label+" stage unlocked! Check the Buddy tab.", 4500);
    } else {
      showToast("+"+earned+" points · check-in logged."+milestoneMsg, 3600);
    }
  }

  // ---------- Pre-session goal setting — see GOAL_TYPES/GOAL_REFLECT_LABELS above for the
  // research this is grounded in. Sets state.pendingGoal, which the very next post-practice
  // check-in will ask about (see the "goal" step below), then clears it.
  function openGoalSetting(){
    var existing = state.pendingGoal;
    state.goalSetting = { type: existing ? existing.type : null, text: existing ? existing.text : "" };
    renderGoalSettingScreen();
  }
  function closeGoalSetting(){ var b=document.getElementById("goalSettingScreen"); if(b) b.remove(); }
  function renderGoalSettingScreen(){
    var existing=document.getElementById("goalSettingScreen"); if(existing) existing.remove();
    var screen=document.createElement("div"); screen.className="checkin-screen"; screen.id="goalSettingScreen";
    var gs = state.goalSetting;
    var typeChips = GOAL_TYPES.map(function(t){
      var sel = gs.type === t;
      return '<button class="chip '+(sel?"selected":"")+'" data-gtype="'+t+'">'+t+'</button>';
    }).join("");
    var header = '<div class="checkin-header"><div class="step-dots"></div><button class="checkin-close" id="closeGoalSetting">'+closeIconSvg(20)+'</button></div>';
    var body = '<div class="q-body-rich">' +
      '<div class="q-topline"><div class="plabel">'+practiceIconSvg("goal")+' Goal for next session</div></div>' +
      '<div class="q-text-rich">What\'s one specific thing you want to focus on or achieve?</div>' +
      '<textarea id="goalTextInput" placeholder="e.g. Keep my elbow up on every serve" style="min-height:80px;">'+gs.text+'</textarea>' +
      '<div class="chip-section"><div class="chip-prompt">What kind of goal is this? (optional)</div><div class="chip-row">'+typeChips+'</div></div>' +
      '<div class="card" style="margin-top:22px;text-align:left;"><p style="font-size:11.5px;">Specific goals outperform vague ones (Locke &amp; Latham\'s Goal-Setting Theory), and process goals — effort, technique, or strategy, things actually in your control — tend to improve performance and lower pre-game anxiety more reliably than outcome goals like the final score.</p></div>' +
    '</div>';
    var footer = '<div class="modal-actions">' +
      (state.pendingGoal ? '<button class="btn-secondary" id="clearGoal">Clear goal</button>' : '') +
      '<button class="btn-primary" id="saveGoal" style="flex:1;" '+(gs.text.trim()?"":"disabled")+'>Save goal</button>' +
    '</div>';
    screen.innerHTML = header + '<div class="checkin-content">'+body+'</div>' + '<div class="checkin-footer">'+footer+'</div>';
    document.getElementById("phone").appendChild(screen);
    document.getElementById("closeGoalSetting").onclick = closeGoalSetting;
    document.getElementById("goalTextInput").oninput = function(e){ gs.text=e.target.value; document.getElementById("saveGoal").disabled = !gs.text.trim(); };
    screen.querySelectorAll("[data-gtype]").forEach(function(b){
      b.onclick = function(){ var t=b.getAttribute("data-gtype"); gs.type = (gs.type===t?null:t); renderGoalSettingScreen(); };
    });
    document.getElementById("saveGoal").onclick = submitGoal;
    var clearBtn = document.getElementById("clearGoal");
    if(clearBtn) clearBtn.onclick = function(){ state.pendingGoal=null; closeGoalSetting(); render(); showToast("Goal cleared."); };
  }
  function submitGoal(){
    var gs = state.goalSetting;
    if(!gs.text.trim()) return;
    state.pendingGoal = { text: gs.text.trim(), type: gs.type, setAt: Date.now() };
    closeGoalSetting();
    render();
    showToast("Goal set — you'll reflect on it after your next session.", 3600);
  }

  // ---------- Post-practice check-in: a separate, longer flow from the daily 4-pillar
  // check-in. Uses labeled numeric scales grounded in real training-load monitoring
  // (Session-RPE, Perceived Recovery Status, DOMS soreness) instead of emoji taps, plus a
  // duration input so it can compute an actual training-load number and track it over time.
  // If a goal was set beforehand (state.pendingGoal), an extra "goal" step is inserted right
  // after session length so the reflection happens while the session's still fresh.
  function openPracticeCheckin(){
    var steps = ["length","focus"];
    if(state.pendingGoal) steps.push("goal");
    steps = steps.concat(["rpe","recovery","soreness","note"]);
    state.practiceCheckin = { step:1, steps:steps, duration:60, sessionType:null, focusTags:[], rpe:null, recovery:null, soreness:null, note:"", goalRating:null, goalNote:"" };
    renderPracticeCheckinScreen();
  }
  function closePracticeCheckin(){ var b=document.getElementById("practiceCheckinScreen"); if(b) b.remove(); }

  function practiceStepDotsHtml(){
    var dots = "";
    var total = state.practiceCheckin.steps.length;
    for(var i=1;i<=total;i++){
      var cls = i < state.practiceCheckin.step ? "done" : (i===state.practiceCheckin.step ? "current" : "");
      dots += '<span class="sdot '+cls+'"></span>';
    }
    return '<div class="step-dots">'+dots+'</div>';
  }

  // Live 0-10 ring preview, reusing the same ring visual language as the pillar check-in
  // (scaled x10 so it maps onto the existing 0-100 ringSvg).
  function liveRingHtml10(val){
    var has = val!==null && val!==undefined;
    var score = has ? val*10 : 0;
    var color = has ? null : "var(--gridline)";
    var textColor = has ? "var(--text-primary)" : "var(--muted)";
    var textVal = has ? val : "–";
    return '<div class="live-ring-wrap">' + ringSvg(score, 92, 10, false, color) + '<div class="live-ring-text" style="color:'+textColor+'">'+textVal+'</div></div>';
  }

  function practiceStepByKey(key){ return PRACTICE_STEPS.filter(function(s){ return s.key===key; })[0]; }

  function renderPracticeCheckinScreen(){
    var existing=document.getElementById("practiceCheckinScreen"); if(existing) existing.remove();
    var screen=document.createElement("div"); screen.className="checkin-screen"; screen.id="practiceCheckinScreen";
    var pc = state.practiceCheckin;
    var step = pc.step;
    var stepType = pc.steps[step-1];
    var isLastStep = step === pc.steps.length;

    var header = '<div class="checkin-header">' + practiceStepDotsHtml() + '<button class="checkin-close" id="closePracticeCheckin">'+closeIconSvg(20)+'</button></div>';
    var body = "", footer = "";

    if(stepType === "length"){
      var typeChips = SESSION_TYPES.map(function(t){
        var sel = pc.sessionType === t;
        return '<button class="chip '+(sel?"selected":"")+'" data-type="'+t+'">'+t+'</button>';
      }).join("");
      body += '<div class="q-body-rich">' +
        '<div class="q-topline"><div class="plabel">'+practiceIconSvg("duration")+' Session length</div></div>' +
        '<div class="q-text-rich">How long was today\'s session?</div>' +
        '<div class="slider-wrap">' +
          '<div class="slider-caption" id="durCaption">'+pc.duration+' min</div>' +
          '<input type="range" class="pillar-range" id="durRange" min="0" max="180" step="5" value="'+pc.duration+'">' +
          '<div class="slider-endlabels"><span>0 min</span><span>180 min</span></div>' +
        '</div>' +
        '<div class="chip-section"><div class="chip-prompt">Session type (optional)</div><div class="chip-row">'+typeChips+'</div></div>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-primary" id="nextPractice" style="flex:1;">Next</button></div>';
    } else if(stepType === "focus"){
      var focusChips = TRAINING_FOCUS_TAGS.map(function(t){
        var sel = pc.focusTags.indexOf(t) !== -1;
        return '<button class="chip '+(sel?"selected":"")+'" data-focus="'+t+'">'+t+'</button>';
      }).join("");
      body += '<div class="q-body-rich">' +
        '<div class="q-topline"><div class="plabel">'+practiceIconSvg("goal")+' Training focus</div></div>' +
        '<div class="q-text-rich">What did you actually work on today?</div>' +
        '<div style="font-size:12px;color:var(--muted);margin:-14px 0 6px;">Optional — pick as many as fit</div>' +
        '<div class="chip-row" style="margin-top:10px;">'+focusChips+'</div>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-secondary" id="backPractice">Back</button><button class="btn-primary" id="nextPractice" style="flex:1;">Next</button></div>';
    } else if(stepType === "goal"){
      var goal = state.pendingGoal;
      var ratingBtns = GOAL_REFLECT_LABELS.map(function(lbl, idx){
        var v = idx+1;
        return '<button class="emoji-btn '+(pc.goalRating===v?"selected":"")+'" data-val="'+v+'"><span class="elvl">'+levelBarsSvg(v, 24)+'</span><span class="elbl">'+lbl+'</span></button>';
      }).join("");
      body += '<div class="q-body-rich">' +
        '<div class="q-topline"><div class="plabel">'+practiceIconSvg("goal")+' Your goal</div></div>' +
        '<div class="q-text-rich">"'+goal.text+'"</div>' +
        '<div style="font-size:12px;color:var(--muted);margin:-14px 0 20px;">How did it go?</div>' +
        '<div class="emoji-row">'+ratingBtns+'</div>' +
        '<div class="note-toggle-wrap" style="width:100%;margin-top:18px;">'+(pc.goalNote || pc._goalNoteOpen ?
          '<textarea id="goalNoteInput" placeholder="Anything to note — optional">'+pc.goalNote+'</textarea>' :
          '<button class="note-toggle" id="goalNoteToggle">+ Add a note</button>') + '</div>' +
        '<div class="card" style="margin-top:22px;text-align:left;"><p style="font-size:11.5px;">Reflecting on a specific goal right after the session — while it\'s still fresh — is the feedback loop that makes goal-setting actually improve performance over time, rather than just being a nice intention.</p></div>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-secondary" id="backPractice">Back</button><button class="btn-primary" id="nextPractice" '+(pc.goalRating?"":"disabled")+'>Next</button></div>';
    } else if(stepType === "rpe" || stepType === "recovery" || stepType === "soreness"){
      var cfg = practiceStepByKey(stepType);
      var val = pc[cfg.key];
      var sliderStart = (val===null||val===undefined) ? Math.round((cfg.min+cfg.max)/2) : val;
      body += '<div class="q-body-rich">' +
        '<div class="q-topline">' + liveRingHtml10(val) + '<div class="plabel">'+cfg.icon+' '+cfg.label+'</div></div>' +
        '<div class="q-text-rich">'+cfg.question+'</div>' +
        '<div class="slider-wrap">' +
          '<div class="slider-caption" id="practiceCaption">'+((val===null||val===undefined)?"Slide to answer":cfg.captionFn(val))+'</div>' +
          '<input type="range" class="pillar-range" id="practiceRange" min="'+cfg.min+'" max="'+cfg.max+'" step="1" value="'+sliderStart+'">' +
          '<div class="slider-endlabels"><span>'+cfg.endLabels[0]+'</span><span>'+cfg.endLabels[1]+'</span></div>' +
        '</div>' +
        '<div class="card" style="margin-top:22px;text-align:left;"><p style="font-size:11.5px;">'+cfg.blurb+'</p></div>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-secondary" id="backPractice">Back</button><button class="btn-primary" id="nextPractice" '+((val===null||val===undefined)?"disabled":"")+'>Next</button></div>';
    } else {
      var load = pc.duration * pc.rpe;
      body += '<div class="q-body" style="justify-content:flex-start;padding-top:10px;">' +
        '<div class="q-text">Anything else about this session?</div>' +
        '<textarea id="practiceNoteInput" placeholder="Optional — e.g. what you worked on, how it went" style="min-height:100px;">'+pc.note+'</textarea>' +
        '<div class="card" style="margin-top:18px;width:100%;text-align:left;"><h3>Training load</h3>' +
          '<p><strong style="color:var(--text-primary);font-size:16px;">'+load+' AU</strong> — duration × session-RPE (Foster\'s method). Logging this over time is what lets Bloom flag sudden load spikes, which is when injury risk goes up.</p></div>' +
      '</div>';
      footer = '<div class="modal-actions"><button class="btn-secondary" id="backPractice">Back</button><button class="btn-primary" id="submitPractice">Finish</button></div>';
    }

    screen.innerHTML = header + '<div class="checkin-content">'+body+'</div>' + '<div class="checkin-footer">'+footer+'</div>';
    document.getElementById("phone").appendChild(screen);
    document.getElementById("closePracticeCheckin").onclick = closePracticeCheckin;

    if(stepType === "length"){
      var durRange = document.getElementById("durRange"), durCaption = document.getElementById("durCaption");
      durRange.oninput = function(){ var v=parseInt(durRange.value,10); pc.duration=v; durCaption.textContent=v+" min"; };
      screen.querySelectorAll("[data-type]").forEach(function(b){
        b.onclick = function(){ var t=b.getAttribute("data-type"); pc.sessionType = (pc.sessionType===t?null:t); renderPracticeCheckinScreen(); };
      });
      document.getElementById("nextPractice").onclick = function(){ pc.step++; renderPracticeCheckinScreen(); };
    } else if(stepType === "focus"){
      screen.querySelectorAll("[data-focus]").forEach(function(b){
        b.onclick = function(){
          var t = b.getAttribute("data-focus");
          var idx = pc.focusTags.indexOf(t);
          if(idx === -1) pc.focusTags.push(t); else pc.focusTags.splice(idx,1);
          renderPracticeCheckinScreen();
        };
      });
      document.getElementById("backPractice").onclick = function(){ pc.step--; renderPracticeCheckinScreen(); };
      document.getElementById("nextPractice").onclick = function(){ pc.step++; renderPracticeCheckinScreen(); };
    } else if(stepType === "goal"){
      screen.querySelectorAll(".emoji-btn").forEach(function(b){
        b.onclick=function(){ pc.goalRating=parseInt(b.getAttribute("data-val"),10); renderPracticeCheckinScreen(); };
      });
      var goalNoteToggle = document.getElementById("goalNoteToggle");
      if(goalNoteToggle) goalNoteToggle.onclick = function(){ pc._goalNoteOpen = true; renderPracticeCheckinScreen(); };
      var goalNoteInput = document.getElementById("goalNoteInput");
      if(goalNoteInput) goalNoteInput.oninput = function(e){ pc.goalNote = e.target.value; };
      document.getElementById("backPractice").onclick = function(){ pc.step--; renderPracticeCheckinScreen(); };
      document.getElementById("nextPractice").onclick = function(){ if(!pc.goalRating) return; pc.step++; renderPracticeCheckinScreen(); };
    } else if(stepType === "rpe" || stepType === "recovery" || stepType === "soreness"){
      var cfg2 = practiceStepByKey(stepType);
      var range = document.getElementById("practiceRange"), cap = document.getElementById("practiceCaption");
      range.oninput = function(){
        var v = parseInt(range.value,10);
        pc[cfg2.key] = v;
        cap.textContent = cfg2.captionFn(v);
        document.getElementById("nextPractice").disabled = false;
      };
      range.onchange = function(){ renderPracticeCheckinScreen(); }; // reveal live ring + full state once released
      var backBtn = document.getElementById("backPractice"); if(backBtn) backBtn.onclick = function(){ pc.step--; renderPracticeCheckinScreen(); };
      document.getElementById("nextPractice").onclick = function(){ if(pc[cfg2.key]===null||pc[cfg2.key]===undefined) return; pc.step++; renderPracticeCheckinScreen(); };
    } else {
      document.getElementById("practiceNoteInput").oninput = function(e){ pc.note = e.target.value; };
      document.getElementById("backPractice").onclick = function(){ pc.step--; renderPracticeCheckinScreen(); };
      document.getElementById("submitPractice").onclick = submitPracticeCheckin;
    }
  }

  function submitPracticeCheckin(){
    var pc = state.practiceCheckin;
    var load = pc.duration * pc.rpe;
    var entry = {
      ts: Date.now(),
      duration: pc.duration, rpe: pc.rpe, recovery: pc.recovery, soreness: pc.soreness,
      load: load, sessionType: pc.sessionType, focusTags: pc.focusTags || [], note: pc.note
    };
    if(pc.steps.indexOf("goal") !== -1 && state.pendingGoal){
      entry.goal = { text: state.pendingGoal.text, type: state.pendingGoal.type, rating: pc.goalRating, note: pc.goalNote };
      state.pendingGoal = null;
    }
    var earnedBadgesBefore = BADGES.filter(function(b){ return b.test(); }).map(function(b){ return b.id; });
    state.practiceLogs.push(entry);
    closePracticeCheckin();
    var zone = loadTrendZone();
    var msg = "Session logged — training load "+load+" AU.";
    if(zone && zone.name==="Elevated") msg += " That's a notable jump from your recent average.";
    var newlyEarnedBadges = BADGES.filter(function(b){ return earnedBadgesBefore.indexOf(b.id)===-1 && b.test(); });
    if(newlyEarnedBadges.length) msg += (newlyEarnedBadges.length===1 ? " New badge earned — "+newlyEarnedBadges[0].label+"!" : " "+newlyEarnedBadges.length+" new badges earned!");
    render();
    showToast(msg, 4200);
  }

  document.querySelectorAll(".tabbar button").forEach(function(b){ b.onclick=function(){ state.tab=b.getAttribute("data-tab"); state.detailPillar=null; state.showInsights=false; state.showPracticeLog=false; state.showTalk=false; render(); }; });

  render();
})();
</script>
</body>
